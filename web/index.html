<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Trends Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>
</head>
<body>

    <div id="container">
        <h1>World Trends Dashboard</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="attributeSelect">Metric:</label>
                <select id="attributeSelect">
                    <option value="Life Ladder" selected>Happiness (Life Ladder)</option>
                    <option value="Log GDP per capita">Log GDP per Capita</option>
                    <option value="Social support">Social Support</option>
                    <option value="Healthy life expectancy at birth">Healthy Life Expectancy</option>
                    <option value="Freedom to make life choices">Freedom to Make Choices</option>
                    <option value="Generosity">Generosity</option>
                    <option value="Perceptions of corruption">Perceptions of Corruption</option>
                </select>
            </div>

            <div class="control-group">
                <label for="yearSlider">Year: <span id="yearLabel">2010</span></label>
                <input type="range" id="yearSlider" min="2010" max="2023" value="2010" step="1">
            </div>
        </div>

        <div id="tooltip" class="tooltip" style="opacity:0;"></div>

        <div id="charts">
            <div class="chart-wrapper">
                <h3>Geographic View</h3>
                <svg id="my_dataviz" width="700" height="440"></svg>
            </div>

            <div class="chart-wrapper">
                <h3>Regional Distribution / Trends</h3>
                <div id="barLegend">
                    <span style="color:#d73027;">■ Low</span>
                    <span style="color:#fee090;">■ Medium</span>
                    <span style="color:#4575b4;">■ High</span>
                </div>
                <svg id="my_barchart" width="700" height="415"></svg>
            </div>
        </div>

        <div id="line-chart-container" class="chart-wrapper" style="margin-top: 30px; width: 100%;">
            <h3>Regional Trends over Time (Average)</h3>
            <svg id="my_linechart" width="1000" height="300"></svg>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
